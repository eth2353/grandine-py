name: Verify Grandine's spec values match local YAML preset files

permissions:
  contents: read

on:
  pull_request:
    branches: [ "master" ]

jobs:
  verify-spec-values-grandine:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uvx --with pyyaml python spec/verify_presets_rust.py
